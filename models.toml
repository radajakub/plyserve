# Models plyserve can serve, keyed by the served name. The served name is the contract with the clients:
# plyllm's vllm registry uses the same string, so it should name the weights and the precision.
#
# repo, revision  Hugging Face checkpoint, pinned to a commit so a rerun loads the same weights
# tunnel_port     VPS port a --tunnel opens for this model; unique, so two servers can tunnel at once
# args            further `vllm serve` flags. plyserve sets the model, revision, served name, host, port
#                 and API key itself, so those are refused here
# backend         "vllm" (default) or "ollama". An Ollama model takes, instead of args:
#   file          the GGUF file in the repository; `plyserve download` fetches only that file
#   parameters    Modelfile PARAMETER values (num_ctx, temperature, stop = [...], ...)

# Both models are FP8: half the memory of BF16, so more of the GPU holds the KV cache and more requests run
# at once. Both are multimodal; --language-model-only skips the vision tower, since the inputs are text.
#
# Kernels are left to vLLM: with a CUDA toolkit loaded (slurm/site.sh) it picks DeepGEMM and FlashInfer, which it
# compiles on first use. On RCI that prefilled ~2.7x faster than the prebuilt fallbacks (--linear-backend cutlass,
# --gdn-prefill-backend triton) for Qwen, with answers at redraw-level agreement (docs/rci.md).

# official FP8 checkpoint from Qwen (128x128 blocks); reasoning parser from the Qwen3.8 vLLM recipe
[models."qwen-3.8-27b-fp8"]
repo = "Qwen/Qwen3.8-27B-FP8"
revision = "017b9c7af6b5689d5dd426a76e0bc077eb5ca20a"
tunnel_port = 18001
args = ["--reasoning-parser", "qwen3", "--language-model-only", "--max-model-len", "65536"]

# The same checkpoint with speculative decoding by its own MTP layer (text_config.mtp_num_hidden_layers = 1), one draft token per step as in vLLM's
# Qwen3.5-27B recipe. A separate served name, so annotations say which server made them and the two can be benchmarked side by side
[models."qwen-3.8-27b-fp8-mtp"]
repo = "Qwen/Qwen3.8-27B-FP8"
revision = "017b9c7af6b5689d5dd426a76e0bc077eb5ca20a"
tunnel_port = 18004
args = ["--reasoning-parser", "qwen3", "--language-model-only", "--max-model-len", "65536", "--speculative-config", '{"method": "mtp", "num_speculative_tokens": 1}']

# Google publishes no FP8 checkpoint, so vLLM quantizes the official BF16 weights to FP8 when it loads them.
# Alternatives: RedHatAI/gemma-4-31B-it-FP8-dynamic (third-party, with published recovery numbers) or Google's
# 4-bit QAT google/gemma-4-31B-it-qat-w4a16-ct. Not yet served with vLLM's default kernels
[models."gemma-4-31b-fp8"]
repo = "google/gemma-4-31B-it"
revision = "842da3794eaa0b77d5f08bae87a17459d91ff475"
tunnel_port = 18002
args = ["--quantization", "fp8", "--reasoning-parser", "gemma4", "--language-model-only", "--max-model-len", "65536"]

# The same Qwen3.8-27B served by Ollama, to compare the two engines on one model. GGUF from ggml-org (the llama.cpp project), converted from Qwen/Qwen3.8-27B.
# Q8_0 is 8-bit like the FP8 checkpoint above but a different scheme (int8 blocks of 32 weights vs FP8 blocks of 128x128), so outputs can differ for that reason alone.
# num_ctx matches --max-model-len above (Ollama's own default depends on the VRAM). The sampling values are those of Qwen's generation_config.json, which vLLM
# applies and Ollama does not read. Ollama's OpenAI API (/v1) replaces temperature and top_p with 1.0 when a request leaves them out, so clients should send them.
# repeat_penalty 1.0 (off) is vLLM's default and Qwen's; Ollama's default was 1.1 in older releases and is 1.0 on main (api/types.go, 2026-10-16), so it is pinned here
[models."qwen-3.8-27b-q8"]
backend = "ollama"
repo = "ggml-org/Qwen3.8-27B-GGUF"
revision = "71bc7b627595dc8a91039addd9c791ae548d6747"
file = "Qwen3.8-27B-Q8_0.gguf"
tunnel_port = 18003
parameters = { num_ctx = 65536, temperature = 1.0, top_k = 20, top_p = 0.95, repeat_penalty = 1.0 }
