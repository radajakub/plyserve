[project]
name = "plyserve"
version = "0.2.0"
description = "Serve open-weight models with vLLM in Slurm jobs, for OpenAI-compatible clients on the same cluster or behind a tunnel."
readme = "README.md"
# tomllib; cluster system Pythons can be much older (e.g. 3.6), so uv provides the interpreter
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jakub Rada", email = "radajak5@fel.cvut.cz" }]
# standard library only: plyserve starts and watches vLLM, it never imports it
dependencies = []

[project.scripts]
plyserve = "plyserve.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plyserve"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 180
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
